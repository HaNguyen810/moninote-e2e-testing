url: https://dev-app.moninotes.com
env:
  TEST_PASSWORD: "Test@123"
---
- launchApp:
    clearState: true
- runScript: ../scripts/generate-test-email.js
- extendedWaitUntil:
    visible: '^Enter email address\s*$'
    timeout: 45000
- tapOn: '^Enter email address\s*$'
- inputText: ${output.email}
- tapOn: '^Password\s*$'
- inputText: ${TEST_PASSWORD}
- tapOn: '^Confirm password\s*$'
- inputText: ${TEST_PASSWORD}
- extendedWaitUntil:
    visible: "Create account"
    timeout: 15000
- tapOn:
    text: "Create account"
    index: 1
- extendedWaitUntil:
    visible: "Select a plan"
    timeout: 30000
- openLink: https://dev-app.moninotes.com/notes
- extendedWaitUntil:
    visible: "Add a note"
    timeout: 20000
