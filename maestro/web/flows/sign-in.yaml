url: https://dev-app.moninotes.com
env:
  TEST_MFA_EMAIL: "moninotes-signintest-mfa@mailinator.com"
  TEST_MFA_PASSWORD: "TestPass123!"
---
- launchApp:
    clearState: true
- runScript:
    file: ../scripts/snapshot-inbox.js
    env:
      INBOX_EMAIL: ${TEST_MFA_EMAIL}
- openLink: https://dev-app.moninotes.com/login
- extendedWaitUntil:
    visible: '^Enter email address\s*$'
    timeout: 20000
- tapOn: '^Enter email address\s*$'
- inputText: ${TEST_MFA_EMAIL}
- tapOn: "Continue"
- assertVisible: "Two factor authentication"
- runScript:
    file: ../scripts/get-mfa-code.js
    env:
      INBOX_EMAIL: ${TEST_MFA_EMAIL}
      KNOWN_MESSAGE_IDS: ${output.knownMessageIds}
- tapOn: '^Enter 6 digit code\s*$'
- inputText: ${output.code}
- tapOn: "Submit"
# The login order is email -> 2FA code -> password (verified against a fresh
# account), not password -> 2FA as originally assumed - the account password
# screen only appears after the code is accepted.
- assertVisible: "Account password"
- tapOn: '^Enter account password\s*$'
- inputText: ${TEST_MFA_PASSWORD}
- tapOn: "Login to your account"
# A fresh account without a confirmed plan re-shows the plan picker on login;
# this fixed test account should already have one, but skip it defensively
# the same way sign-up.yaml does if it ever shows up.
- runFlow:
    when:
      visible: "Select a plan"
    commands:
      - openLink: https://dev-app.moninotes.com/notes
- assertVisible: "Add a note"
