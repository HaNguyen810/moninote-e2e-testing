url: https://dev-app.moninotes.com
env:
  TEST_MFA_EMAIL: "moninotes-signintest-mfa@mailinator.com"
---
- launchApp:
    clearState: true
- openLink: https://dev-app.moninotes.com/login
- extendedWaitUntil:
    visible: '^Enter email address\s*$'
    timeout: 20000
- tapOn: '^Enter email address\s*$'
- inputText: ${TEST_MFA_EMAIL}
- tapOn: "Continue"
- assertVisible: "Two factor authentication"
- runScript:
    file: ../scripts/get-mfa-code.js
    env:
      INBOX_EMAIL: ${TEST_MFA_EMAIL}
- tapOn: '^Enter 6 digit code\s*$'
- inputText: ${output.code}
- tapOn: "Submit"
- assertVisible: "Add a note"
